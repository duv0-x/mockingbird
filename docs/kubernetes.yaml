# mockingbird on Kubernetes — SPEC.md §10 (T6) example.
#
#   kubectl apply -f docs/kubernetes.yaml
#
# Prerequisite: build the image (make docker) and push it to a registry your
# cluster can reach, then update `image:` below.
#
# Single replica: the native store is a PVC-backed JSON dir with per-process
# locking — do not scale the Deployment; shard or share a read-only seed dir
# instead.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mockingbird-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mockingbird-seed
data:
  demo.json: |
    {
      "schemaVersion": 1,
      "kind": "RestProject",
      "id": "SeedD0",
      "name": "Kubernetes demo",
      "created": "2026-01-01T00:00:00.000Z",
      "updated": "2026-01-01T00:00:00.000Z",
      "applications": [
        {
          "id": "SeedA0",
          "name": "demo",
          "resources": [
            {
              "id": "SeedU0",
              "name": "/hello",
              "uri": "/hello",
              "methods": [
                {
                  "id": "SeedM0",
                  "name": "sayHello",
                  "httpMethod": "GET",
                  "mockResponses": [
                    {
                      "id": "SeedR0",
                      "name": "hello",
                      "httpStatusCode": 200,
                      "body": "hello from the seed ConfigMap"
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockingbird
  labels:
    app: mockingbird
spec:
  replicas: 1
  strategy:
    type: Recreate # the PVC is ReadWriteOnce
  selector:
    matchLabels:
      app: mockingbird
  template:
    metadata:
      labels:
        app: mockingbird
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        fsGroup: 65532 # chown the PVC so the nonroot user can write to it
      containers:
        - name: mockingbird
          image: mockingbird:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MOCKINGBIRD_DATA_DIR
              value: /data
            - name: MOCKINGBIRD_SEED_DIR
              value: /seeds
            # Only used when the store has no users yet:
            # - name: MOCKINGBIRD_ADMIN_PASSWORD
            #   valueFrom:
            #     secretKeyRef: { name: mockingbird-admin, key: password }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seeds
              mountPath: /seeds
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mockingbird-data
        - name: seeds
          configMap:
            name: mockingbird-seed
---
apiVersion: v1
kind: Service
metadata:
  name: mockingbird
spec:
  selector:
    app: mockingbird
  ports:
    - name: http
      port: 8080
      targetPort: http